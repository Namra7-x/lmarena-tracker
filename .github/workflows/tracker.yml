name: LMArena Model Tracker

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/1 * * * *'
  
  # Allow manual trigger
  workflow_dispatch:
  
  # Run on push (for testing)
  push:
    branches: [ main ]

jobs:
  check-models:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run model tracker
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python lmarena_tracker.py
    
    - name: Commit updated model list
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add known_models.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update model list [skip ci]" && git push)
