name: LMArena Model Tracker

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-models:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: pip install requests
    
    - name: Run tracker
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python lmarena_tracker.py
    
    - name: Commit changes if any
      run: |
        git config user.name "bot"
        git config user.email "bot@github.com"
        
        # Only add and commit if file exists
        if [ -f "known_models.json" ]; then
          git add known_models.json
          
          # Only commit if there are changes
          if ! git diff --quiet --staged; then
            git commit -m "Update models [skip ci]"
            git push
            echo "✅ Changes committed"
          else
            echo "✅ No changes to commit"
          fi
        else
          echo "⚠️  known_models.json not created yet"
        fi
