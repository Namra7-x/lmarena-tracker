on:
  repository_dispatch:
    types: [tracker]
  workflow_dispatch:

concurrency:
  group: arena-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install cloudscraper requests

      - name: Run LMArena tracker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py

      - name: Run DesignArena tracker
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python design_tracker.py

      - name: Commit snapshots
        if: always()
        run: |
          git config user.name "arena-tracker-bot"
          git config user.email "actions@github.com"
          git add snapshot.json design_snapshot.json .arena_alert_state.json
          git diff --cached --quiet || git commit -m "snapshot update"
          git pull --rebase
          git push
