on:
  repository_dispatch:
    types: [tracker]
  workflow_dispatch:

concurrency:
  group: arena-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Run Canary Arena Tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node tracker.mjs

      - name: Run DesignArena Tracker
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node design_tracker.mjs

      - name: Commit snapshots
        if: always()
        run: |
          git config user.name "arena-tracker-bot"
          git config user.email "actions@github.com"
          git add snapshot.json design_snapshot.json
          if [ -f .arena_alert_state.json ]; then git add .arena_alert_state.json; fi
          git diff --cached --quiet || git commit -m "snapshot update"
          git pull --rebase
          git push
