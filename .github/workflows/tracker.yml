name: DesignArena Tracker

on:
  push:
    branches: [main]
    paths-ignore:
      - design_snapshot.json
  repository_dispatch:
    types: [tracker]
  workflow_dispatch:

concurrency:
  group: designarena-tracker
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  track-designarena:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install DesignArena tracker dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Run DesignArena tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python design_tracker.py

      - name: Commit DesignArena snapshot
        if: success()
        run: |
          git config user.name "designarena-tracker-bot"
          git config user.email "actions@github.com"
          git add design_snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "Update DesignArena snapshot"
            git pull --rebase
            git push
          fi
