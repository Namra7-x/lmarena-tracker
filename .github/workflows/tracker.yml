name: DesignArena Tracker

on:
  schedule:
    - cron: '*/1 * * * *'
  repository_dispatch:
    types: [tracker]
  workflow_dispatch:

concurrency:
  group: designarena-tracker
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  track-designarena:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run DesignArena tracker
        working-directory: design-arena
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node design_tracker.mjs

      - name: Commit DesignArena snapshot
        if: success()
        run: |
          git config user.name "designarena-tracker-bot"
          git config user.email "actions@github.com"
          git add design-arena/design_snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "Update DesignArena snapshot [skip ci]"
            for attempt in 1 2 3; do
              echo "Pushing DesignArena snapshot (attempt $attempt)..."
              if git pull --rebase origin main && git push origin main; then
                echo "Successfully updated DesignArena snapshot"
                exit 0
              fi
              echo "Concurrent push detected. Retrying in 2s..."
              sleep 2
            done
            echo "Contention high. Snapshot will automatically sync on next run."
            exit 0
          fi
