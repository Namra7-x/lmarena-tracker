on:
  repository_dispatch:
    types: [tracker]
  workflow_dispatch:

concurrency:
  group: arena-tracker
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          show-progress: false

      - name: Test Arena parser
        run: node --test tests/test_arena_parser.mjs

      - name: Run Trackers in Parallel
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          node tracker.mjs &
          PID1=$!
          node design_tracker.mjs &
          PID2=$!
          node selector_tracker.mjs &
          PID3=$!
          wait $PID1 $PID2 $PID3

      - name: Commit snapshots
        if: always()
        run: |
          git config user.name "arena-tracker-bot"
          git config user.email "actions@github.com"
          git add snapshot.json design_snapshot.json
          if [ -f selector_snapshot.json ]; then git add selector_snapshot.json; fi
          if [ -f .arena_alert_state.json ]; then git add .arena_alert_state.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "snapshot update"
            git pull --rebase
            git push
          fi
