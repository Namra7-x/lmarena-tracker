name: DesignArena Tracker

on:
  push:
    branches: [main]
    paths-ignore:
      - design-arena/design_snapshot.json
  repository_dispatch:
    types: [tracker]
  workflow_dispatch:

concurrency:
  group: designarena-tracker
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  track-designarena:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          show-progress: false

      - name: Run DesignArena tracker
        working-directory: design-arena
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node design_tracker.mjs

      - name: Commit DesignArena snapshot
        if: success()
        run: |
          git config user.name "designarena-tracker-bot"
          git config user.email "actions@github.com"
          git add design-arena/design_snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "Update DesignArena snapshot [skip ci]"
            git pull --rebase
            git push
          fi
