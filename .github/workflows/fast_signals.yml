name: Fast Signals Tracker

on:
  schedule:
    - cron: '*/1 * * * *'
  repository_dispatch:
    types: [tracker, fast_signals, api_tracker, qwen_tracker, early_radar, radar, hf_tracker, sdk_tracker]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fast-signals
  cancel-in-progress: true

jobs:
  run-fast-signals:
    name: Fast Signals (API, Radar, HF, SDK, DesignArena)
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run All Fast Signals
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          API_DISCORD_WEBHOOK_URL: ${{ secrets.API_DISCORD_WEBHOOK_URL }}
          API_TRACKER_DISCORD_WEBHOOK_URL: ${{ secrets.API_TRACKER_DISCORD_WEBHOOK_URL }}
          QWEN_DISCORD_WEBHOOK_URL: ${{ secrets.QWEN_DISCORD_WEBHOOK_URL }}
          EARLY_RADAR_DISCORD_WEBHOOK_URL: ${{ secrets.EARLY_RADAR_DISCORD_WEBHOOK_URL }}
          RADAR_DISCORD_WEBHOOK_URL: ${{ secrets.RADAR_DISCORD_WEBHOOK_URL }}
          HF_DISCORD_WEBHOOK_URL: ${{ secrets.HF_DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOKEN_CLAUDE: ${{ secrets.TELEGRAM_TOKEN_CLAUDE }}
          TELEGRAM_TOKEN_ANTHROPIC: ${{ secrets.TELEGRAM_TOKEN_ANTHROPIC }}
          TELEGRAM_CHAT_ID_CLAUDE: ${{ secrets.TELEGRAM_CHAT_ID_CLAUDE }}
          TELEGRAM_CHAT_ID_ANTHROPIC: ${{ secrets.TELEGRAM_CHAT_ID_ANTHROPIC }}
          TELEGRAM_TOPIC_CLAUDE: ${{ secrets.TELEGRAM_TOPIC_CLAUDE }}
          TELEGRAM_TOPIC_ANTHROPIC: ${{ secrets.TELEGRAM_TOPIC_ANTHROPIC }}
          TELEGRAM_TOKEN_CHATGPT: ${{ secrets.TELEGRAM_TOKEN_CHATGPT }}
          TELEGRAM_TOKEN_OPENAI: ${{ secrets.TELEGRAM_TOKEN_OPENAI }}
          TELEGRAM_CHAT_ID_CHATGPT: ${{ secrets.TELEGRAM_CHAT_ID_CHATGPT }}
          TELEGRAM_CHAT_ID_OPENAI: ${{ secrets.TELEGRAM_CHAT_ID_OPENAI }}
          TELEGRAM_TOPIC_OPENAI: ${{ secrets.TELEGRAM_TOPIC_OPENAI }}
          TELEGRAM_TOKEN_GEMINI: ${{ secrets.TELEGRAM_TOKEN_GEMINI }}
          TELEGRAM_TOKEN_GOOGLE: ${{ secrets.TELEGRAM_TOKEN_GOOGLE }}
          TELEGRAM_CHAT_ID_GEMINI: ${{ secrets.TELEGRAM_CHAT_ID_GEMINI }}
          TELEGRAM_CHAT_ID_GOOGLE: ${{ secrets.TELEGRAM_CHAT_ID_GOOGLE }}
          TELEGRAM_TOPIC_GEMINI: ${{ secrets.TELEGRAM_TOPIC_GEMINI }}
          TELEGRAM_TOPIC_GOOGLE: ${{ secrets.TELEGRAM_TOPIC_GOOGLE }}
        run: node fast-signals/runner.mjs

      - name: Commit and Push Snapshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add api-tracker/api_snapshot.json early-radar/radar_snapshot.json hf-tracker/hf_snapshot.json reverse-tracker/state/sdk_snapshot.json design-arena/design_snapshot.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            echo "Snapshot changes detected. Committing..."
            git commit -m "Update fast signals snapshots [skip ci]"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "Successfully pushed snapshot updates."
                break
              fi
              sleep 2
            done
          fi
