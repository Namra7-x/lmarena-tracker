name: Arena parser tests

on:
  push:
    branches:
      - main
      - fix/arena-leaderboard-rsc
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  parser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check tracker.mjs && node --check arena_parser.mjs
      - name: Run parser regression tests
        run: node --test tests/test_arena_parser.mjs
