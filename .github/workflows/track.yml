name: Track Models

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 15 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Run Detailed Tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          chmod +x track.sh
          ./track.sh
      
      - name: Commit All Changes
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add models_list.txt models_data.json models_new.txt models_detailed_new.json || true
          git diff --quiet --staged || git commit -m "Update models data [skip ci]"
          git push || true
