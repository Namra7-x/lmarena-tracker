name: Probe Arena source coverage

on:
  push:
    branches:
      - investigate/arena-source-coverage

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch public page variants and count model-data markers
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/arena-source-probe

          count() {
            (grep -ao "$1" "$2" 2>/dev/null || true) | wc -l | tr -d '[:space:]'
          }

          while IFS='|' read -r label url; do
            file="/tmp/arena-source-probe/${label}.html"
            headers="/tmp/arena-source-probe/${label}.headers"

            meta="$(curl -L --compressed -sS --max-time 35 \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36' \
              -H 'Cache-Control: no-cache' \
              -D "$headers" -o "$file" \
              -w '%{http_code}|%{url_effective}|%{size_download}' \
              "$url" 2>/tmp/arena-curl-error)" || {
                echo "SOURCE ${label} | CURL_ERROR | $(tr '\n' ' ' </tmp/arena-curl-error)"
                continue
              }

            bytes="$(wc -c < "$file" | tr -d '[:space:]')"
            keys="$(count modelKey "$file")"
            displays="$(count modelDisplayName "$file")"
            initial="$(count initialModels "$file")"
            initial_state="$(count initialState "$file")"
            public_names="$(count publicName "$file")"
            display_names="$(count displayName "$file")"
            selectable="$(count userSelectable "$file")"
            next_flight="$(count 'self.__next_f.push' "$file")"

            decoded="/tmp/arena-source-probe/${label}.decoded.html"
            sed 's/\\\"/"/g' "$file" > "$decoded"
            unique_keys="$((grep -aoE '"modelKey"[[:space:]]*:[[:space:]]*"[^"]+"' "$decoded" 2>/dev/null || true) |
              sed -E 's/.*"modelKey"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/' |
              sort -u | wc -l | tr -d '[:space:]')"

            echo "SOURCE ${label} | meta=${meta} | bytes=${bytes} | modelKey=${keys} | unique_modelKey=${unique_keys} | modelDisplayName=${displays} | initialModels=${initial} | initialState=${initial_state} | publicName=${public_names} | displayName=${display_names} | userSelectable=${selectable} | next_flight=${next_flight}"

            if [[ "$keys" != "0" || "$initial" != "0" || "$initial_state" != "0" || "$public_names" != "0" ]]; then
              echo "SAMPLE ${label}"
              grep -aoE '.{0,30}(modelKey|modelDisplayName|initialModels|initialState|publicName|userSelectable).{0,100}' "$file" |
                head -3 || true
            fi
          done <<'URLS'
          canary-root|https://canaryarena.ai/
          canary-direct|https://canaryarena.ai/direct
          arena-root|https://arena.ai/
          arena-text-direct|https://arena.ai/text/direct
          arena-text-sbs|https://arena.ai/text/side-by-side
          arena-sbs|https://arena.ai/side-by-side
          arena-leaderboard|https://arena.ai/leaderboard
          arena-text-board|https://arena.ai/leaderboard/text
          arena-code-board|https://arena.ai/leaderboard/code
          arena-vision-board|https://arena.ai/leaderboard/vision
          arena-agent-board|https://arena.ai/leaderboard/agent
          URLS

          python3 - <<'PY'
          import glob, json, os, re
          def decode(path):
              raw = open(path, encoding="utf-8", errors="replace").read()
              parts = []
              pat = re.compile(r'self\.__next_f\.push\(\[1,"((?:\\.|[^"\\])*)"\]\)', re.S)
              for m in pat.finditer(raw):
                  try: parts.append(json.loads('"' + m.group(1) + '"'))
                  except Exception: pass
              return "\n".join(parts)

          def extract_array(text, key='"initialModels":'):
              start_key = text.find(key)
              if start_key < 0: return None
              start = text.find("[", start_key + len(key))
              if start < 0: return None
              depth = 0
              quoted = False
              escaped = False
              for i in range(start, len(text)):
                  ch = text[i]
                  if quoted:
                      if escaped: escaped = False
                      elif ch == "\\": escaped = True
                      elif ch == '"': quoted = False
                      continue
                  if ch == '"': quoted = True
                  elif ch == "[": depth += 1
                  elif ch == "]":
                      depth -= 1
                      if depth == 0:
                          try: return json.loads(text[start:i+1])
                          except Exception: return None
              return None

          for path in sorted(glob.glob("/tmp/arena-source-probe/*.html")):
              label = os.path.basename(path).replace(".html", "")
              text = decode(path)
              models = extract_array(text)
              if isinstance(models, list) and models:
                  true_count = sum(m.get("userSelectable") is True for m in models if isinstance(m, dict))
                  false_count = sum(m.get("userSelectable") is False for m in models if isinstance(m, dict))
                  unknown_count = sum(m.get("userSelectable") not in (True, False) for m in models if isinstance(m, dict))
                  print(f"REGISTRY {label} | models={len(models)} | selectable_true={true_count} | selectable_false={false_count} | unknown={unknown_count}")
                  hidden = [m for m in models if isinstance(m, dict) and m.get("userSelectable") is False]
                  for m in hidden[:12]:
                      print("HIDDEN_SAMPLE " + json.dumps({
                          "id": m.get("id"), "publicName": m.get("publicName"),
                          "displayName": m.get("displayName"),
                          "organization": m.get("organization"),
                          "userSelectable": m.get("userSelectable")
                      }, ensure_ascii=False))
          PY
