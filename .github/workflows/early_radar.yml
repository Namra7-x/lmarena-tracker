name: Early Signal Radar

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:
    inputs:
      force_alert:
        description: 'Send real live alert cards right now'
        required: false
        default: true
        type: boolean
  repository_dispatch:
    types: [tracker, early_radar, radar]

permissions:
  contents: write

concurrency:
  group: early-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Early Signal Radar
        env:
          EARLY_RADAR_DISCORD_WEBHOOK_URL: ${{ secrets.EARLY_RADAR_DISCORD_WEBHOOK_URL }}
          RADAR_DISCORD_WEBHOOK_URL: ${{ secrets.RADAR_DISCORD_WEBHOOK_URL }}
          HF_DISCORD_WEBHOOK_URL: ${{ secrets.HF_DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_ALERT: ${{ inputs.force_alert == true && '1' || '0' }}
        run: node early-radar/radar.mjs

      - name: Commit and Push Snapshot (Only if genuine new models detected)
        run: |
          if [ -n "$(git status --porcelain early-radar/radar_snapshot.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add early-radar/radar_snapshot.json
            git commit -m "Update Early Radar snapshot [skip ci]"
            git push origin main
          else
            echo "Zero changes detected. No commit needed."
          fi
