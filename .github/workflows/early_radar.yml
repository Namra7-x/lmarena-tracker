name: Early Signal Radar

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:
    inputs:
      force_alert:
        description: 'Send real live alert cards right now'
        required: false
        default: true
        type: boolean
  repository_dispatch:
    types: [tracker, early_radar, radar]

permissions:
  contents: write

concurrency:
  group: early-radar
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Early Signal Radar
        env:
          EARLY_RADAR_DISCORD_WEBHOOK_URL: ${{ secrets.EARLY_RADAR_DISCORD_WEBHOOK_URL }}
          RADAR_DISCORD_WEBHOOK_URL: ${{ secrets.RADAR_DISCORD_WEBHOOK_URL }}
          HF_DISCORD_WEBHOOK_URL: ${{ secrets.HF_DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_ALERT: ${{ inputs.force_alert == true && '1' || '0' }}
        run: node early-radar/radar.mjs

      - name: Commit and Push Snapshot (Only if changes detected)
        run: |
          if [ -n "$(git status --porcelain early-radar/radar_snapshot.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add early-radar/radar_snapshot.json
            git commit -m "Update Early Radar snapshot [skip ci]"
            for attempt in 1 2 3; do
              echo "Pushing Early Radar snapshot (attempt $attempt)..."
              if git pull --rebase origin main && git push origin main; then
                echo "Successfully updated Early Radar snapshot"
                exit 0
              fi
              echo "Concurrent push detected. Retrying in 2s..."
              sleep 2
            done
            echo "Contention high. Snapshot will automatically sync on next run."
            exit 0
          else
            echo "Zero changes detected. No commit needed."
          fi
