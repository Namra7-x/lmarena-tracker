name: Early Feature & Signal Tracker

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [tracker, early_signal_tracker]
  workflow_dispatch:
    inputs:
      test_run:
        description: 'One-time test scan on latest versions and send leaks to Telegram'
        required: false
        type: boolean
        default: true
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  scan-family:
    name: Track ${{ matrix.family }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ai-${{ matrix.family }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        family:
          - openai
          - anthropic
          - google
          - cursor
          - devin
          - other

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          show-progress: false

      - name: Checkout State Branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: state/${{ matrix.family }}
          path: state
          fetch-depth: 1

      - name: Ensure State Directory Exists
        run: |
          mkdir -p state
          echo "Current state files for ${{ matrix.family }}:"
          ls -la state/ 2>/dev/null || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node Dependencies
        run: npm ci

      - name: Install 7-Zip and Pin GoReSym v3.4.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full curl unzip
          GORESYM_URL="https://github.com/mandiant/GoReSym/releases/download/v3.4.1/GoReSym-linux.zip"
          GORESYM_SHA256="a557124857f95a589f8ce3525119c2d18c7c7fc7c4225c92ff94e3effb38748d"
          curl -sSL "$GORESYM_URL" -o /tmp/GoReSym.zip
          echo "$GORESYM_SHA256  /tmp/GoReSym.zip" | sha256sum -c -
          sudo unzip -o /tmp/GoReSym.zip -d /usr/local/bin/
          sudo chmod +x /usr/local/bin/GoReSym
          rm -f /tmp/GoReSym.zip
          GoReSym -h || true

      - name: Run Tracker Detection & Deep Scan
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          STATE_DIR: state
          REPORTS_DIR: reports
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOKEN_OPENAI: ${{ secrets.TELEGRAM_TOKEN_OPENAI || secrets.TELEGRAM_TOKEN_CHATGPT }}
          TELEGRAM_TOKEN_ANTHROPIC: ${{ secrets.TELEGRAM_TOKEN_ANTHROPIC || secrets.TELEGRAM_TOKEN_CLAUDE }}
          TELEGRAM_TOKEN_GOOGLE: ${{ secrets.TELEGRAM_TOKEN_GOOGLE || secrets.TELEGRAM_TOKEN_GEMINI }}
          TELEGRAM_TOKEN_CURSOR: ${{ secrets.TELEGRAM_TOKEN_CURSOR || secrets.TELEGRAM_TOKEN_OPENCODE }}
          TELEGRAM_TOKEN_DEVIN: ${{ secrets.TELEGRAM_TOKEN_DEVIN }}
          TELEGRAM_TOKEN_OPENCODE: ${{ secrets.TELEGRAM_TOKEN_OPENCODE }}
          TELEGRAM_TOKEN_OTHER: ${{ secrets.TELEGRAM_TOKEN_OTHER || secrets.TELEGRAM_TOKEN_OPENCODE }}
          TELEGRAM_CHAT_ID_OPENAI: ${{ secrets.TELEGRAM_CHAT_ID_OPENAI || secrets.TELEGRAM_CHAT_ID_CHATGPT || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_ANTHROPIC: ${{ secrets.TELEGRAM_CHAT_ID_ANTHROPIC || secrets.TELEGRAM_CHAT_ID_CLAUDE || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_GOOGLE: ${{ secrets.TELEGRAM_CHAT_ID_GOOGLE || secrets.TELEGRAM_CHAT_ID_GEMINI || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_CURSOR: ${{ secrets.TELEGRAM_CHAT_ID_CURSOR || secrets.TELEGRAM_CHAT_ID_OPENCODE || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_DEVIN: ${{ secrets.TELEGRAM_CHAT_ID_DEVIN || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_OPENCODE: ${{ secrets.TELEGRAM_CHAT_ID_OPENCODE || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_OTHER: ${{ secrets.TELEGRAM_CHAT_ID_OTHER || secrets.TELEGRAM_CHAT_ID_OPENCODE || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_OPENAI: ${{ secrets.TELEGRAM_TOPIC_OPENAI || secrets.TELEGRAM_TOPIC_CHATGPT }}
          TELEGRAM_TOPIC_ANTHROPIC: ${{ secrets.TELEGRAM_TOPIC_ANTHROPIC || secrets.TELEGRAM_TOPIC_CLAUDE }}
          TELEGRAM_TOPIC_GOOGLE: ${{ secrets.TELEGRAM_TOPIC_GOOGLE || secrets.TELEGRAM_TOPIC_GEMINI }}
          TELEGRAM_TOPIC_CURSOR: ${{ secrets.TELEGRAM_TOPIC_CURSOR || secrets.TELEGRAM_TOPIC_OPENCODE }}
          TELEGRAM_TOPIC_DEVIN: ${{ secrets.TELEGRAM_TOPIC_DEVIN }}
          TELEGRAM_TOPIC_OPENCODE: ${{ secrets.TELEGRAM_TOPIC_OPENCODE }}
          TELEGRAM_TOPIC_OTHER: ${{ secrets.TELEGRAM_TOPIC_OTHER || secrets.TELEGRAM_TOPIC_OPENCODE }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.test_run }}" = "true" ]; then
            echo "🧪 Workflow dispatch test run requested for family: ${{ matrix.family }}..."
            node reverse-tracker/cli.mjs test-run --family=${{ matrix.family }}
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "🧪 Commit push detected: executing one-time pipeline test for family: ${{ matrix.family }}..."
            node reverse-tracker/cli.mjs test-run --family=${{ matrix.family }}
          else
            node reverse-tracker/cli.mjs run --family=${{ matrix.family }}
          fi

      - name: Persist State to State Branch
        if: always()
        run: |
          if [ ! -d "state" ] || [ -z "$(ls -A state/*.json 2>/dev/null)" ]; then
            echo "No state files to persist."
            exit 0
          fi

          cd state
          git config user.name "early-signal-tracker-bot"
          git config user.email "actions@github.com"
          git add *.json

          if ! git diff --cached --quiet; then
            echo "State changes detected. Committing..."
            git commit -m "Update compact state for ${{ matrix.family }} [skip ci]"
            for attempt in 1 2 3; do
              echo "Pushing state (attempt $attempt)..."
              if git push origin HEAD:refs/heads/state/${{ matrix.family }}; then
                echo "Successfully pushed state/${{ matrix.family }}"
                break
              else
                echo "Push failed, pulling remote changes..."
                git pull --rebase origin state/${{ matrix.family }} || true
                sleep 2
              fi
            done
          else
            echo "No state differences detected; skipping push."
          fi

      - name: Upload Scan Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.family }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
