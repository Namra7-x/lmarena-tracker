name: Early Feature & Signal Tracker

on:
  repository_dispatch:
    types: [tracker, early_signal_tracker]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  scan-family:
    name: Track ${{ matrix.family }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ai-${{ matrix.family }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        family:
          - openai
          - anthropic
          - google
          - cursor
          - devin
          - other

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          show-progress: false

      - name: Checkout State Branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: state/${{ matrix.family }}
          path: state
          fetch-depth: 1

      - name: Ensure State Directory Exists
        run: |
          mkdir -p state
          echo "Current state files for ${{ matrix.family }}:"
          ls -la state/ 2>/dev/null || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Tracker Detection & Deep Scan
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          STATE_DIR: state
          REPORTS_DIR: reports
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOKEN_OPENAI: ${{ secrets.TELEGRAM_TOKEN_OPENAI || secrets.TELEGRAM_TOKEN_CHATGPT }}
          TELEGRAM_TOKEN_ANTHROPIC: ${{ secrets.TELEGRAM_TOKEN_ANTHROPIC || secrets.TELEGRAM_TOKEN_CLAUDE }}
          TELEGRAM_TOKEN_GOOGLE: ${{ secrets.TELEGRAM_TOKEN_GOOGLE || secrets.TELEGRAM_TOKEN_GEMINI }}
          TELEGRAM_TOKEN_CURSOR: ${{ secrets.TELEGRAM_TOKEN_CURSOR }}
          TELEGRAM_TOKEN_DEVIN: ${{ secrets.TELEGRAM_TOKEN_DEVIN }}
        run: |
          node reverse-tracker/cli.mjs run --family=${{ matrix.family }}

      - name: Persist State to State Branch
        if: success()
        run: |
          if [ ! -d "state" ] || [ -z "$(ls -A state/*.json 2>/dev/null)" ]; then
            echo "No state files to persist."
            exit 0
          fi

          cd state
          git config user.name "early-signal-tracker-bot"
          git config user.email "actions@github.com"
          git add *.json

          if ! git diff --cached --quiet; then
            echo "State changes detected. Committing..."
            git commit -m "Update compact state for ${{ matrix.family }} [skip ci]"
            for attempt in 1 2 3; do
              echo "Pushing state (attempt $attempt)..."
              if git push origin HEAD:refs/heads/state/${{ matrix.family }}; then
                echo "Successfully pushed state/${{ matrix.family }}"
                break
              else
                echo "Push failed, pulling remote changes..."
                git pull --rebase origin state/${{ matrix.family }} || true
                sleep 2
              fi
            done
          else
            echo "No state differences detected; skipping push."
          fi

      - name: Upload Scan Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.family }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
